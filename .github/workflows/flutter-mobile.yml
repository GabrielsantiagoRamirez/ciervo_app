name: Flutter mobile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build unsigned debug APK
        run: flutter build apk --debug --dart-define=APP_ENV=prod
